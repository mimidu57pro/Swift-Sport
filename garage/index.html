<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a090b">
<link rel="icon" href="../assets/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Atelier de nuit : même ADN que la vitrine (noir chaud, accent rouge, mono pour les chiffres). Tableau de bord en haut, trois ateliers en onglets. */
:root{
  --bg:#0a090b; --panel:#121114; --panel2:#0f0e11; --line:#242127; --line2:#2f2b33;
  --fg:#ece7e2; --muted:#9a929e; --dim:#6f6873;
  --acc:#ff2a3c; --acc-soft:rgba(255,42,60,.14);
  --ok:#3ddc84; --warn:#ffb020; --bad:#ff4d5e; --info:#5aa9ff;
  --f-d:'Space Grotesk',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-m:'JetBrains Mono',ui-monospace,'SFMono-Regular',Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-d);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:1140px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 120px}
button{font:inherit;color:inherit}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.mono{font-family:var(--f-m);font-variant-numeric:tabular-nums}
.kick{font-family:var(--f-m);font-size:11px;letter-spacing:3px;color:var(--muted);text-transform:uppercase}
h1,h2,h3{text-wrap:balance;margin:0;font-weight:500}
a{color:var(--fg)}

/* en-tête */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:22px 10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:44px;height:44px;border-radius:12px;background:linear-gradient(150deg,#2a2730,#141216);border:1px solid var(--line2);display:grid;place-items:center;font-size:22px;box-shadow:0 10px 30px -14px var(--acc)}
.brand b{display:block;font-size:19px;font-weight:600;letter-spacing:.2px}
.brand small{display:block;font-family:var(--f-m);font-size:10.5px;letter-spacing:2.5px;color:var(--muted)}
.toplinks{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:7px;min-height:38px;padding:0 14px;border-radius:999px;border:1px solid var(--line2);background:rgba(255,255,255,.04);text-decoration:none;font-size:13px;cursor:pointer}
.pill:hover{border-color:color-mix(in srgb,var(--acc) 60%,var(--line2))}
.pill.edit-on{background:var(--acc);border-color:var(--acc);color:#0a090b}
.fuel{display:flex;align-items:center;gap:8px 18px;flex-wrap:wrap;margin-top:12px;padding:12px 16px;border-radius:16px;border:1px solid var(--line);background:var(--panel2);font-size:13.5px}
.fuel .f{display:inline-flex;align-items:baseline;gap:6px;color:var(--muted)}
.fuel .f b{font-family:var(--f-m);font-weight:500;color:var(--fg);font-size:15px}
.fuel .f.on{color:var(--fg)}.fuel .f.on b{color:var(--acc)}
.fuel small{color:var(--dim);font-size:12px;margin-left:auto;display:inline-flex;align-items:center;gap:8px;white-space:nowrap;flex-wrap:wrap}
.fuel .dot{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok);display:inline-block}
.fuel svg{display:block}
.banner{margin:6px 0 14px;padding:10px 14px;border-radius:12px;border:1px solid var(--line2);background:var(--panel2);font-size:13px;color:var(--muted)}

/* héros */
.hero{position:relative;border-radius:26px;border:1px solid var(--line);background:radial-gradient(120% 140% at 0% 0%,rgba(255,42,60,.10) 0%,transparent 45%),linear-gradient(180deg,#141216,#0d0c0f);padding:22px;overflow:hidden}
.hero-grid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:22px;align-items:center}
.big{font-size:clamp(40px,7vw,70px);font-weight:500;letter-spacing:-2px;line-height:1}
.big .u{font-size:.42em;color:var(--muted);letter-spacing:0;margin-left:6px}
.sub{color:var(--muted);font-size:14px;margin-top:6px}
.bar{position:relative;height:12px;border-radius:999px;background:rgba(255,255,255,.07);overflow:hidden;margin-top:18px;display:flex}
.bar i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:10px;font-size:12.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend em{width:9px;height:9px;border-radius:3px;display:inline-block}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.kpi{background:#111013;padding:14px 16px;min-width:0}
.kpi .v{font-size:23px;font-weight:500;letter-spacing:-.5px;white-space:nowrap}
.kpi .l{font-size:12px;color:var(--muted)}
.kpi .v.acc{color:var(--acc)}

/* onglets */
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;margin:18px 0 20px;padding:6px;border-radius:999px;background:rgba(18,17,20,.88);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--line);display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.tab{min-height:46px;border:0;border-radius:999px;background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;font-size:15px;font-weight:500;color:var(--muted);transition:background .3s ease,color .3s ease}
.tab .n{font-family:var(--f-m);font-size:11px;padding:2px 7px;border-radius:999px;background:rgba(255,255,255,.08);color:var(--muted)}
.tab.on{background:var(--fg);color:#0a090b}.tab.on .n{background:rgba(10,9,11,.12);color:#0a090b}
.view{animation:viewin .45s cubic-bezier(.2,.8,.2,1) both}
@keyframes viewin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* blocs communs */
.sec{margin-top:26px}
.sec-h{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.sec-h h2{font-size:clamp(22px,3.4vw,30px);letter-spacing:-.5px}
.card{border-radius:20px;border:1px solid var(--line);background:var(--panel);padding:18px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{min-height:34px;padding:0 13px;border-radius:999px;border:1px solid var(--line2);background:transparent;font-size:13px;color:var(--muted);cursor:pointer}
.chip.on{background:var(--acc-soft);border-color:var(--acc);color:var(--fg)}
.btn{min-height:42px;padding:0 16px;border-radius:999px;border:0;background:var(--fg);color:#0a090b;font-weight:500;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.btn.ghost{background:rgba(255,255,255,.06);color:var(--fg);border:1px solid var(--line2)}
.btn.red{background:var(--acc);color:#0a090b}
.btn:active,.chip:active{transform:scale(.97)}

/* prépa : catégories */
.donutbox{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.donut{width:170px;height:170px;flex:0 0 auto}
.donut text{font-family:var(--f-m)}
.catlist{flex:1 1 220px;min-width:0;display:flex;flex-direction:column;gap:6px}
.sw{width:10px;height:10px;border-radius:3px;display:inline-block}
.catrow{display:grid;grid-template-columns:10px 22px minmax(0,1fr) auto;gap:8px;align-items:center;font-size:13.5px;border:0;background:transparent;padding:4px 6px;border-radius:8px;cursor:pointer;text-align:left}
.catrow:hover{background:rgba(255,255,255,.04)}
.catrow .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.catrow .pr{font-family:var(--f-m);color:var(--muted)}
.ring{display:flex;align-items:center;gap:16px}
.cat{margin-top:12px;border-radius:20px;border:1px solid var(--line);background:var(--panel);overflow:hidden}
.cat-h{display:flex;align-items:center;gap:12px;padding:14px 16px;cursor:pointer;width:100%;border:0;background:transparent;text-align:left}
.cat-h .em{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:20px;background:rgba(255,255,255,.05);flex:0 0 auto}
.cat-h .t{flex:1 1 auto;min-width:0}
.cat-h .t b{display:block;font-size:16.5px;font-weight:500}
.cat-h .t small{color:var(--muted);font-size:12.5px}
.cat-h .tot{font-family:var(--f-m);font-size:16px;text-align:right}
.cat-h .tot small{display:block;font-size:11px;color:var(--muted)}
.cat-h .chev{transition:transform .3s ease;color:var(--muted)}
.cat.open .chev{transform:rotate(180deg)}
.minibar{height:3px;background:rgba(255,255,255,.05);display:flex}
.minibar i{display:block;height:100%}
.rows{display:none;border-top:1px solid var(--line)}
.cat.open .rows{display:block;animation:viewin .35s ease both}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:11px 16px;border-bottom:1px solid #1b191e}
.row:last-child{border-bottom:0}
.row .nm{min-width:0}
.row .nm b{font-weight:500;font-size:14.5px;display:block}
.row .nm small{font-family:var(--f-m);font-size:10.5px;letter-spacing:1px;color:var(--acc);text-transform:uppercase}
.row .nm .meta{font-size:12px;color:var(--dim)}
.price{font-family:var(--f-m);font-size:15px;text-align:right;white-space:nowrap;background:transparent;border:0;cursor:default;padding:4px 2px}
.price .k{display:block;font-size:10px;color:var(--warn);letter-spacing:.5px}
.price .k.r{color:var(--ok)}
.editing .price{cursor:pointer;border-bottom:1px dashed var(--line2)}
.st{min-height:30px;padding:0 10px;border-radius:999px;font-size:12px;border:1px solid var(--line2);background:transparent;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.st i{width:7px;height:7px;border-radius:50%;display:inline-block}
.st.prevu i{background:var(--dim)} .st.achete i{background:var(--warn)} .st.installe i{background:var(--ok)}
.st.installe{border-color:color-mix(in srgb,var(--ok) 40%,var(--line2))}
.editing .st{cursor:pointer}
.addrow{display:flex;justify-content:flex-end;padding:10px 16px;border-top:1px solid var(--line)}
.fun{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.fun .card{padding:14px}
.fun .v{font-size:22px;font-weight:500}
.fun .l{font-size:12.5px;color:var(--muted)}

/* entretien */
.next{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:16px;align-items:center}
.next .em{font-size:38px;width:68px;height:68px;border-radius:18px;display:grid;place-items:center;background:rgba(255,255,255,.05)}
.inputs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-size:12px;color:var(--muted)}
.field input,.field select,.field textarea{width:100%;min-height:46px;border-radius:12px;border:1px solid var(--line2);background:#0c0b0e;color:var(--fg);padding:0 12px;font:inherit;font-size:16px}
.field textarea{min-height:80px;padding:10px 12px;resize:vertical}
.field input[readonly]{opacity:.75}
.tasks{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:12px}
.task{border-radius:18px;border:1px solid var(--line);background:var(--panel);padding:14px;display:flex;flex-direction:column;gap:10px;position:relative;overflow:hidden}
.task::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--dim)}
.task.ok::before{background:var(--ok)}.task.soon::before{background:var(--warn)}.task.over::before{background:var(--bad)}.task.na::before{background:var(--line2)}
.task-h{display:flex;gap:10px;align-items:flex-start}
.task-h .em{font-size:22px;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:rgba(255,255,255,.05);flex:0 0 auto}
.task-h b{font-weight:500;display:block;line-height:1.3}
.task-h small{font-size:12px;color:var(--muted)}
.state{margin-left:auto;font-size:11px;font-family:var(--f-m);padding:3px 8px;border-radius:999px;white-space:nowrap}
.ok .state{background:rgba(61,220,132,.12);color:var(--ok)}.soon .state{background:rgba(255,176,32,.14);color:var(--warn)}.over .state{background:rgba(255,77,94,.14);color:var(--bad)}.na .state{background:rgba(255,255,255,.06);color:var(--muted)}

.yb .y{font-family:var(--f-m);font-size:11px;color:var(--muted)}

.tl{position:relative;padding-left:26px;margin-top:6px}
.tl::before{content:"";position:absolute;left:9px;top:6px;bottom:6px;width:2px;background:linear-gradient(180deg,var(--acc),var(--line2) 30%,var(--line2))}
.tl-y{font-family:var(--f-m);font-size:12px;letter-spacing:3px;color:var(--acc);margin:18px 0 8px -26px;padding-left:26px;position:relative}
.tl-y::before{content:"";position:absolute;left:4px;top:4px;width:12px;height:12px;border-radius:50%;background:var(--acc);box-shadow:0 0 0 4px var(--bg),0 0 14px var(--acc)}
.ev{position:relative;border-radius:16px;border:1px solid var(--line);background:var(--panel);padding:12px 14px;margin-bottom:10px;display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:12px;align-items:center}

/* tactile */

.qa button:active{transform:scale(.97)}
.toast{display:flex;align-items:center;gap:12px;max-width:calc(100vw - 32px)}.toast>span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.toast .undo{border:0;background:#0a090b;color:var(--fg);border-radius:999px;min-height:30px;padding:0 12px;font-size:13px;cursor:pointer}

@media (max-width:760px){
 .tabs{display:none}
 .bnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:40;align-items:center;gap:4px;padding:8px max(10px,env(safe-area-inset-left,0px)) calc(8px + env(safe-area-inset-bottom,0px));background:rgba(12,11,14,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line)}
 .bnav .bt{flex:1 1 0;min-height:54px;border:0;background:transparent;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11.5px;color:var(--muted);cursor:pointer;position:relative}
 .bnav .bt .ic{font-size:21px;line-height:1;filter:grayscale(1);opacity:.55;transition:filter .2s ease,opacity .2s ease,transform .2s ease}
 .bnav .bt.on{color:var(--fg)}.bnav .bt.on .ic{filter:none;opacity:1;transform:translateY(-1px)}
 .bnav .bt.on::after{content:"";position:absolute;bottom:2px;width:18px;height:3px;border-radius:2px;background:var(--acc)}
 .bnav .bt .bd{position:absolute;top:4px;left:calc(50% + 8px);min-width:17px;height:17px;padding:0 4px;border-radius:999px;background:var(--acc);color:#0a090b;font-size:10px;font-family:var(--f-m);display:grid;place-items:center}
 .bnav .side{flex:1 1 0;display:flex;min-width:0}
 .dfab{display:none!important}
 .fab{flex:0 0 auto;width:58px;height:58px;border-radius:19px;border:0;background:var(--acc);color:#0a090b;font-size:30px;line-height:1;box-shadow:0 12px 26px -8px rgba(255,42,60,.7);margin:-26px 4px 0;cursor:pointer}
 .fab:active{transform:scale(.94)}
 .wrap{padding-bottom:calc(120px + env(safe-area-inset-bottom,0px))}
 .toast{bottom:calc(92px + env(safe-area-inset-bottom,0px))!important}
 .row{grid-template-columns:minmax(0,1fr) auto!important;grid-template-areas:"nm nm" "st pr";row-gap:6px;padding:12px 16px}
 .row .nm{grid-area:nm}.row .stc{grid-area:st;grid-column:auto!important}.row .price{grid-area:pr;align-self:center}
 .row .price .k{display:inline;margin-left:6px}
 .cat-h .tot small{display:none}
 .st{min-height:34px;padding:0 12px}
 .addrow,.sec-h .btn{display:none}
 .sheet .acts{position:sticky;bottom:calc(-20px - env(safe-area-inset-bottom,0px));background:#141216;margin:16px -18px -20px;padding:12px 18px calc(14px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
}
/* fiche d'édition */
.sheet-bg{position:fixed;inset:0;z-index:50;background:rgba(5,4,6,.62);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:flex;align-items:flex-end;justify-content:center;animation:fadebg .25s ease both}
@keyframes fadebg{from{opacity:0}to{opacity:1}}
.sheet{width:min(560px,100%);max-height:88vh;overflow:auto;background:#141216;border:1px solid var(--line2);border-radius:24px 24px 0 0;padding:20px max(18px,env(safe-area-inset-left,0px)) calc(20px + env(safe-area-inset-bottom,0px));animation:sheetin .35s cubic-bezier(.2,.8,.2,1) both}
@media (min-width:700px){.sheet-bg{align-items:center}.sheet{border-radius:24px}}

@media (max-width:860px){.hero-grid,.tire,.costs{grid-template-columns:minmax(0,1fr)}.inputs{grid-template-columns:repeat(2,minmax(0,1fr))}.fun{grid-template-columns:repeat(2,minmax(0,1fr))}.grid2,.grid3{grid-template-columns:minmax(0,1fr)}}
@media (max-width:520px){.tab{font-size:13.5px;gap:5px}.tab .n{display:none}.row{grid-template-columns:minmax(0,1fr) auto;}.row .stc{grid-column:1/-1;justify-self:start}.next{grid-template-columns:auto minmax(0,1fr)}.next .act{grid-column:1/-1}.sheet .fgrid{grid-template-columns:minmax(0,1fr)}.ev{grid-template-columns:32px minmax(0,1fr)}.ev .c{grid-column:2;text-align:left}.kpi .v{font-size:20px}.fuel{display:grid;grid-template-columns:auto repeat(3,minmax(0,1fr));gap:8px 10px}.fuel .f{flex-direction:column;gap:0;font-size:12px}.fuel .f b{font-size:14px}.fuel small{grid-column:1/-1;margin-left:0;justify-content:space-between}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

<script>
(function(){
'use strict';
const CATS=[
 {id:'moteur',e:'🔥',n:'Moteur & admission',c:'#ff2a3c'},
 {id:'huile',e:'🛢️',n:'Huile & lubrification',c:'#ff7a2a'},
 {id:'refroid',e:'❄️',n:'Refroidissement',c:'#4fc3ff'},
 {id:'echap',e:'💨',n:'Échappement',c:'#b07cff'},
 {id:'trans',e:'⚙️',n:'Transmission',c:'#ffd23f'},
 {id:'chassis',e:'🏁',n:'Châssis & suspension',c:'#3ddc84'},
 {id:'roues',e:'🛞',n:'Roues & pneus',c:'#e6e1dc'},
 {id:'freins',e:'🛑',n:'Freinage',c:'#ff5c8a'},
 {id:'look',e:'✨',n:'Carrosserie & éclairage',c:'#5aa9ff'},
 {id:'elec',e:'📟',n:'Instruments & électronique',c:'#2ee6c9'},
 {id:'cabin',e:'🪑',n:'Habitacle',c:'#c9a27a'},
 {id:'autre',e:'📦',n:'Divers',c:'#8f8794'}];
const CAT=Object.fromEntries(CATS.map(c=>[c.id,c]));
const STAT={prevu:'Prévu',achete:'Acheté',installe:'Installé'};
const NEXT={prevu:'achete',achete:'installe',installe:'prevu'};
const TYPES={prepa:{e:'🔧',n:'Prépa'},entretien:{e:'🛠️',n:'Entretien'},achat:{e:'🛒',n:'Achat'},sortie:{e:'🏁',n:'Sortie / circuit'},reparation:{e:'🩹',n:'Réparation'},etape:{e:'⭐',n:'Moment fort'}};
const TIRES={ps5:{n:'Michelin Pilot Sport 5',p:640,life:30000},pzero:{n:'Pirelli P Zero',p:600,life:26000},re71:{n:'Bridgestone Potenza Sport',p:560,life:26000},ad08:{n:'Yokohama Advan Neova AD08R',p:620,life:16000},crs:{n:'Nankang CR-S (semi-slick)',p:420,life:10000}};
const HP={stock:136,prep:155};
const FUELS={sp98:'SP98',sp95:'SP95',e10:'SP95-E10'};

let hintOff=false;try{hintOff=localStorage.getItem('garage_hint')==='1';}catch(e){}
const S={hintOff:hintOff,parts:[],tasks:[],log:[],set:{},fuel:null,fuelLive:null,fuelHist:[],db:null,canEdit:false,edit:false,tab:'prepa',filter:'all',open:{},ready:{},noDb:false};
const $=s=>document.querySelector(s);
const esc=v=>String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const eur=(n,d)=>(n==null||isNaN(n))?'—':new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR',maximumFractionDigits:d==null?0:d}).format(n);
const num=n=>(n==null||isNaN(n))?'—':new Intl.NumberFormat('fr-FR').format(Math.round(n));
const fdate=d=>{if(!d)return'';const x=new Date(d+'T12:00:00');return isNaN(x)?d:x.toLocaleDateString('fr-FR',{day:'numeric',month:'short',year:'numeric'});};
const today=()=>new Date().toISOString().slice(0,10);
const monthsSince=d=>{if(!d)return null;const a=new Date(d+'T12:00:00'),b=new Date();return (b.getFullYear()-a.getFullYear())*12+(b.getMonth()-a.getMonth())+(b.getDate()-a.getDate())/30;};
const addMonths=(d,m)=>{const x=new Date(d+'T12:00:00');x.setMonth(x.getMonth()+m);return x.toISOString().slice(0,10);};
try{const h=location.hash.replace('#','');if(['prepa','entretien','budget','carnet'].includes(h))S.tab=h;}catch(e){}

/* ---------- calculs ---------- */
function totals(){
  const t={all:0,inst:0,ach:0,prev:0,byCat:{},cnt:{prevu:0,achete:0,installe:0}};
  S.parts.forEach(p=>{const v=+p.price||0;t.all+=v;t.byCat[p.cat]=(t.byCat[p.cat]||0)+v;t.cnt[p.status]=(t.cnt[p.status]||0)+1;if(p.status==='installe')t.inst+=v;else if(p.status==='achete')t.ach+=v;else t.prev+=v;});
  t.spent=t.inst+t.ach;return t;}
function taskState(t){
  const km=S.set.kmNow;let pk=null,pm=null;
  if(t.everyKm&&t.lastKm!=null&&km!=null)pk=(km-t.lastKm)/t.everyKm;
  if(t.everyMonths&&t.lastDate)pm=monthsSince(t.lastDate)/t.everyMonths;
  const has=(t.everyKm||t.everyMonths);
  if(!has)return{st:'info',pct:0,label:'Info'};
  if(pk==null&&pm==null)return{st:'na',pct:0,label:'À renseigner'};
  const pct=Math.max(pk||0,pm||0);
  const dueKm=t.everyKm&&t.lastKm!=null?t.lastKm+t.everyKm:null,dueDate=t.everyMonths&&t.lastDate?addMonths(t.lastDate,t.everyMonths):null;
  const leftKm=dueKm!=null&&km!=null?dueKm-km:null;
  return{st:pct>=1?'over':pct>=.8?'soon':'ok',pct,label:pct>=1?'Dépassé':pct>=.8?'Bientôt':'OK',dueKm,dueDate,leftKm};}
function perYear(t){const ky=+S.set.kmYear||0;const a=t.everyKm?ky/t.everyKm:0,b=t.everyMonths?12/t.everyMonths:0;return Math.max(a,b)*(+t.cost||0);}
function fuelData(){return S.fuelLive||S.fuel;}
function fuelP(){const k=S.set.fuel||'sp98',F=fuelData();if(F&&+F[k]>0)return +F[k];return +S.set.fuelPrice||0;}
function annual(){
  const ky=+S.set.kmYear||0;const lines=[];
  const ent=S.tasks.reduce((s,t)=>s+perYear(t),0);
  const tire=TIRES[(S.set.tire||{}).model]||TIRES.ps5;const tireY=ky?tire.p*ky/tire.life:0;
  const fuel=ky*(+S.set.conso||0)/100*fuelP();
  const ins=+S.set.insurance||0;
  lines.push({e:'⛽',n:'Carburant ('+FUELS[S.set.fuel||'sp98']+')',v:fuel,c:'#ffd23f'},{e:'🛠️',n:'Entretien périodique',v:ent,c:'#3ddc84'},{e:'🛞',n:'Pneus (usure)',v:tireY,c:'#e6e1dc'},{e:'🛡️',n:'Assurance',v:ins,c:'#5aa9ff'});
  const tot=lines.reduce((s,l)=>s+l.v,0);return{lines,tot,perKm:ky?tot/ky:null,ent,tireY,fuel};}

/* ---------- rendu ---------- */
let rq=0;function render(){if(rq)return;rq=requestAnimationFrame(()=>{rq=0;draw();});}
function draw(){const ae=document.activeElement,fid=ae&&ae.id&&ae.closest&&ae.closest('#view')?ae.id:null;renderHero();renderTabs();({prepa:vPrepa,entretien:vEntretien,budget:vBudget,carnet:vCarnet})[S.tab]();if(fid){const f=document.getElementById(fid);if(f)try{f.focus({preventScroll:true});}catch(e){}}
  document.body.classList.toggle('editing',S.edit);
  $('#banner').innerHTML=S.noDb?'<div class="banner">Les données du garage ne sont pas joignables dans cet aperçu : ouvre la page depuis claude.ai pour voir et modifier le carnet.</div>':(S.canEdit&&!S.hintOff?'<div class="banner hint"><span>✍️ Touche une pièce, un prix ou une carte pour la modifier. Le statut change d\'un tap, et <b>＋</b> ajoute ce que tu veux.</span><button class="x" data-hint="1" type="button" aria-label="Masquer l\'astuce">×</button></div>':'');}
function renderHero(){

function donut(data,size,center,sub){
  const tot=data.reduce((s,d)=>s+d.v,0)||1;let a=-Math.PI/2;const R=70,r=48,cx=85,cy=85;let p='';
  data.forEach(d=>{if(!d.v)return;const a2=a+d.v/tot*Math.PI*2-0.012;const big=a2-a>Math.PI?1:0;
    const P=(ang,rad)=>[cx+Math.cos(ang)*rad,cy+Math.sin(ang)*rad];const[x1,y1]=P(a,R),[x2,y2]=P(a2,R),[x3,y3]=P(a2,r),[x4,y4]=P(a,r);
    p+=`<path d="M${x1.toFixed(2)} ${y1.toFixed(2)}A${R} ${R} 0 ${big} 1 ${x2.toFixed(2)} ${y2.toFixed(2)}L${x3.toFixed(2)} ${y3.toFixed(2)}A${r} ${r} 0 ${big} 0 ${x4.toFixed(2)} ${y4.toFixed(2)}Z" fill="${d.c}"><title>${esc(d.n)} : ${esc(eur(d.v))}</title></path>`;a=a2+0.012;});
  return `<svg class="donut" viewBox="0 0 170 170" role="img" aria-label="Répartition"><circle cx="85" cy="85" r="59" fill="none" stroke="rgba(255,255,255,.05)" stroke-width="22"/>${p}<text x="85" y="84" text-anchor="middle" fill="#ece7e2" font-size="17">${esc(center)}</text><text x="85" y="101" text-anchor="middle" fill="#9a929e" font-size="9.5" letter-spacing="1.5">${esc(sub)}</text></svg>`;}

  <div class="card sec"><div class="kick">Les réglages du calcul</div><div class="inputs" style="margin-top:12px">
   <div class="field"><label for="kmYear">Km par an</label><input id="kmYear" type="number" inputmode="numeric" data-set="kmYear" value="${S.set.kmYear??''}" ${ro}></div>
   <div class="field"><label for="conso">Conso (L/100)</label><input id="conso" type="number" step="0.1" inputmode="decimal" data-set="conso" value="${S.set.conso??''}" ${ro}></div>
   ${F?`<div class="field"><label for="fuelSel">Carburant</label><select id="fuelSel" data-fuel="1" ${S.edit?'':'disabled'}>${Object.entries(FUELS).map(([kk,n])=>`<option value="${kk}" ${kk===k?'selected':''}>${n}</option>`).join('')}</select></div>`:`<div class="field"><label for="fuelPrice">Prix carburant (€/L)</label><input id="fuelPrice" type="number" step="0.01" inputmode="decimal" data-set="fuelPrice" value="${S.set.fuelPrice??''}" ${ro}></div>`}
   <div class="field"><label for="insurance">Assurance (€/an)</label><input id="insurance" type="number" inputmode="numeric" data-set="insurance" value="${S.set.insurance??''}" placeholder="à renseigner" ${ro}></div>
  </div></div>
  </div>`;$('#view').innerHTML=h;}

function timeline(){
  const ev=[];
  S.log.forEach(l=>ev.push({k:'log',id:l.id,type:l.type||'etape',date:l.date,km:l.km,title:l.title,cost:+l.cost||0,note:l.note}));
  S.parts.forEach(p=>{if(p.date&&p.status!=='prevu')ev.push({k:'part',id:p.id,type:'prepa',date:p.date,km:p.km,title:(p.status==='installe'?'Pose : ':'Achat : ')+p.name,cost:+p.price||0,note:p.brand||''});});
  return ev.sort((a,b)=>(b.date||'').localeCompare(a.date||''));}
function vCarnet(){
  const ev=timeline();const byY={};ev.forEach(e=>{const y=(e.date||'????').slice(0,4);(byY[y]=byY[y]||[]).push(e);});
  const years=Object.keys(byY).sort();const ys=years.map(y=>({y,v:byY[y].reduce((s,e)=>s+e.cost,0)}));const maxY=Math.max(1,...ys.map(x=>x.v));
  const t=totals();const nInst=t.cnt.installe||0;
  const B=[['🔧','Moitié de la prépa posée',nInst>=S.parts.length/2&&S.parts.length>0],['🏁','Prépa terminée',S.parts.length>0&&nInst===S.parts.length],['🛠️','Entretien à jour',S.tasks.length&&S.tasks.every(x=>!['over','na'].includes(taskState(x).st)||taskState(x).st==='info')],['📖','10 entrées au carnet',ev.length>=10],['🛞','Pneus suivis',(S.set.tire||{}).mountKm!=null],['💸','10 000 € engagés',t.spent>=10000],['🌍','100 000 km',(S.set.kmNow||0)>=100000]];
  let h=`<div class="view">
   <div class="sec-h"><div><div class="kick">L'histoire de la voiture</div><h2>Carnet de bord</h2></div>${S.edit?'<button class="btn red" data-add="log" type="button">＋ Nouvelle entrée</button>':''}</div>
   <div class="card"><div class="kick">Badges</div><div class="badges" style="margin-top:10px">${B.map(([e,n,on])=>`<span class="badge ${on?'on':''}"><span class="e">${e}</span>${n}</span>`).join('')}</div></div>
   <div class="card sec"><div class="kick">Dépenses par année</div>${ys.filter(x=>x.y!=='????').length?`<div class="years">${ys.filter(x=>x.y!=='????').map(x=>`<div class="yb"><span class="p">${eur(x.v)}</span><div class="b" style="height:${(x.v/maxY*100).toFixed(0)}%"></div><span class="y">${x.y}</span></div>`).join('')}</div>`:'<div style="color:var(--muted);font-size:13.5px;margin-top:8px">Les barres apparaissent dès que des entrées datées ont un coût.</div>'}</div>
   <div class="sec"><div class="kick">Frise</div>`;
  if(!ev.length)h+=`<div class="empty" style="margin-top:10px"><b>La frise est vide</b>Elle mélange tout : tes entrées, les pièces achetées ou posées (dès qu'elles ont une date), et les entretiens faits.</div>`;
  else{h+=`<div class="tl">`;years.slice().reverse().forEach(y=>{h+=`<div class="tl-y">${y==='????'?'SANS DATE':y} · ${eur(byY[y].reduce((s,e)=>s+e.cost,0))}</div>`;
    byY[y].forEach(e=>{const T=TYPES[e.type]||TYPES.etape;const ea=S.edit?({log:'data-editlog',part:'data-editpart'})[e.k]:'';h+=`<div class="ev t-${e.type} ${ea?'tap':''}" ${ea?`${ea}="${e.id}" role="button" tabindex="0"`:''}><span class="em">${T.e}</span><div style="min-width:0"><b>${esc(e.title)}</b><small>${[e.date?fdate(e.date):'',e.km!=null?num(e.km)+' km':'',T.n,e.note?esc(e.note):''].filter(Boolean).join(' · ')}</small></div><div class="c">${e.cost?eur(e.cost):''}</div></div>`;});});h+=`</div>`;}
  h+=`</div></div>`;$('#view').innerHTML=h;}

/* ---------- fiches d'édition ---------- */
function openSheet(inner){
  const box=$('#sheet');box.innerHTML=`<div class="sheet-bg">${inner}</div>`;
  const bg=box.querySelector('.sheet-bg'),sh=box.querySelector('.sheet');
  const close=()=>{if(!box.firstChild)return;sh.style.transition='transform .22s ease,opacity .22s ease';sh.style.transform='translateY(60px)';sh.style.opacity='0';bg.style.transition='opacity .22s ease';bg.style.opacity='0';setTimeout(()=>{box.innerHTML='';},200);};
  bg.addEventListener('click',e=>{if(e.target===bg)close();});
  /* glisser vers le bas pour fermer */
  let y0=null,dy=0;
  sh.addEventListener('touchstart',e=>{if(sh.scrollTop>0||e.target.closest('input,select,textarea'))return;y0=e.touches[0].clientY;dy=0;sh.style.transition='none';},{passive:true});
  sh.addEventListener('touchmove',e=>{if(y0==null)return;dy=Math.max(0,e.touches[0].clientY-y0);sh.style.transform=`translateY(${dy}px)`;},{passive:true});
  sh.addEventListener('touchend',()=>{if(y0==null)return;y0=null;if(dy>90)close();else{sh.style.transition='transform .2s ease';sh.style.transform='';}},{passive:true});
  return {box,sh,close};}
function sheet(title,fields,vals,onSave,onDel,focus){
  let armed=false;
  const {close}=openSheet(`<form class="sheet" id="sf"><div class="grab" aria-hidden="true"></div><h3>${esc(title)}</h3><div class="fgrid">${fields.map(f=>{const v=vals[f.k]??'';const id='f_'+f.k;
    const inp=f.t==='select'?`<select id="${id}" name="${f.k}">${f.o.map(([k,n])=>`<option value="${esc(k)}" ${String(v)===String(k)?'selected':''}>${esc(n)}</option>`).join('')}</select>`:f.t==='area'?`<textarea id="${id}" name="${f.k}">${esc(v)}</textarea>`:`<input id="${id}" name="${f.k}" type="${f.t==='number'?'text':(f.t||'text')}" ${f.t==='number'?'inputmode="decimal" autocomplete="off"':''} value="${esc(v)}" ${f.ph?`placeholder="${esc(f.ph)}"`:''}>`;
    return `<div class="field ${f.w?'wide':''}"><label for="${id}">${esc(f.l)}</label>${inp}</div>`;}).join('')}</div>
    <div class="acts"><div>${onDel?'<button class="btn ghost" type="button" id="sdel">Supprimer</button>':''}</div><div style="display:flex;gap:8px"><button class="btn ghost" type="button" id="scancel">Annuler</button><button class="btn red" type="submit">Enregistrer</button></div></div></form>`);
  $('#scancel').onclick=close;
  if(onDel)$('#sdel').onclick=()=>{if(!armed){armed=true;$('#sdel').textContent='Confirmer la suppression';$('#sdel').classList.add('red');return;}onDel();close();};
  $('#sf').addEventListener('submit',e=>{e.preventDefault();const o={};fields.forEach(f=>{let v=$('#f_'+f.k).value;if(f.t==='number'){v=String(v).replace(/\s/g,'').replace(',','.');v=v===''||isNaN(+v)?null:+v;}if(f.t==='date'&&!v)v=null;o[f.k]=v;});onSave(o);close();});
  if(focus){const f=$('#f_'+focus);if(f)setTimeout(()=>{try{f.focus({preventScroll:true});if(f.select)f.select();}catch(e){}},60);}}
function quick(){
  const items=[['km','📍','Kilométrage',S.set.kmNow!=null?'Compteur : '+num(S.set.kmNow)+' km':'Mettre à jour le compteur'],['part','🔧','Pièce','Prix, statut, date'],['log','📖','Entrée au carnet','Sortie, réparation…'],['task','🛠️','Entretien','Nouvelle échéance']];
  const {close}=openSheet(`<div class="sheet"><div class="grab" aria-hidden="true"></div><h3>Ajouter au garage</h3><div class="qa">${items.map(([k,i,n,d])=>`<button type="button" data-qa="${k}"><span class="i">${i}</span><span><b>${n}</b><br><small>${esc(d)}</small></span></button>`).join('')}</div></div>`);
  quick.close=close;}
function kmSheet(){sheet('Kilométrage actuel',[{k:'kmNow',l:'Compteur (km)',t:'number',w:1,ph:'ex. 92 400'}],{kmNow:S.set.kmNow},o=>{if(o.kmNow==null)return;S.set.kmNow=o.kmNow;save('settings/main',{kmNow:o.kmNow},!!S.ready.set);render();toast('📍 '+num(o.kmNow)+' km');},null,'kmNow');}
function toast(m,undo){$('#toastBox').innerHTML=`<div class="toast" role="status"><span>${esc(m)}</span>${undo?'<button class="undo" type="button">Annuler</button>':''}</div>`;
  if(undo)$('#toastBox .undo').onclick=()=>{undo();$('#toastBox').innerHTML='';};
  clearTimeout(toast.t);toast.t=setTimeout(()=>{$('#toastBox').innerHTML='';},undo?5000:2200);}
async function save(path,data,merge){if(!S.db)return toast('Enregistrement indisponible ici');try{if(merge)await S.db.doc(path).update(data);else await S.db.doc(path).set(data);}catch(e){toast(e&&e.code==='quota_exceeded'?'Le garage est plein : supprime quelques entrées':'Échec de l\'enregistrement, réessaie');}}
async function del(path,quiet){if(!S.db)return;try{await S.db.doc(path).delete();if(!quiet)toast('Supprimé');}catch(e){toast('Suppression impossible');}}
const newId=c=>S.db?S.db.collection(c).doc().id:'x'+Date.now();

const PART_F=[{k:'name',l:'Pièce',w:1},{k:'status',l:'Statut',t:'select',o:Object.entries(STAT)},{k:'price',l:'Prix (€)',t:'number'},{k:'priceKind',l:'Type de prix',t:'select',o:[['reel','Prix payé'],['estime','Estimation']]},{k:'brand',l:'Marque'},{k:'cat',l:'Catégorie',t:'select',o:CATS.map(c=>[c.id,c.e+' '+c.n])},{k:'date',l:'Date (achat ou pose)',t:'date'},{k:'km',l:'Kilométrage',t:'number'},{k:'note',l:'Note',t:'area',w:1}];
const TASK_F=[{k:'emoji',l:'Emoji'},{k:'name',l:'Entretien'},{k:'lastKm',l:'Dernier fait à (km)',t:'number'},{k:'lastDate',l:'Dernier fait le',t:'date'},{k:'everyKm',l:'Tous les (km)',t:'number'},{k:'everyMonths',l:'Ou tous les (mois)',t:'number'},{k:'cost',l:'Coût estimé (€)',t:'number'},{k:'note',l:'Note',t:'area',w:1}];
const LOG_F=[{k:'title',l:'Titre',w:1,ph:'ex. Pose des combinés BC Racing'},{k:'type',l:'Type',t:'select',o:Object.entries(TYPES).map(([k,v])=>[k,v.e+' '+v.n])},{k:'date',l:'Date',t:'date'},{k:'km',l:'Kilométrage',t:'number'},{k:'cost',l:'Coût (€)',t:'number'},{k:'note',l:'Note',t:'area',w:1}];

/* ---------- navigation ---------- */
const ORDER=['prepa','entretien','budget','carnet'];
function goTab(t){if(t===S.tab)return;const dir=ORDER.indexOf(t)>ORDER.indexOf(S.tab)?'from-r':'from-l';S.tab=t;try{history.replaceState(null,'','#'+t);}catch(er){}draw();
  const v=$('#view .view');if(v){v.classList.add(dir);}
  const y=$('#view').getBoundingClientRect().top+window.scrollY-(window.innerWidth>760?80:14);if(window.scrollY>y)window.scrollTo({top:y,behavior:'smooth'});}
(function(){let sx=0,sy=0,st=0;const V=$('#view');
  V.addEventListener('touchstart',e=>{if(e.touches.length!==1){st=0;return;}const t=e.touches[0];sx=t.clientX;sy=t.clientY;st=Date.now();},{passive:true});
  V.addEventListener('touchend',e=>{if(!st)return;const t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy,dt=Date.now()-st;st=0;
    if(e.target.closest('input,select,textarea,.years,.chips'))return;
    if(Math.abs(dx)>70&&Math.abs(dy)<Math.abs(dx)*.5&&dt<650){const i=ORDER.indexOf(S.tab)+(dx<0?1:-1);if(i>=0&&i<ORDER.length)goTab(ORDER[i]);}},{passive:true});})();

window.addEventListener('hashchange',()=>{const h=location.hash.replace('#','');if(ORDER.includes(h))goTab(h);});
/* ---------- interactions ---------- */
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('[role=button][tabindex]')){e.preventDefault();e.target.click();}if(e.key==='Escape'&&$('#sheet').firstChild)$('#sheet').innerHTML='';});
document.addEventListener('click',e=>{
  const b=e.target.closest('button,[data-editpart],[data-edittask],[data-editlog]');if(!b||b.disabled)return;
  if(b.dataset.tab){goTab(b.dataset.tab);return;}
  if(b.dataset.hint){S.hintOff=true;try{localStorage.setItem('garage_hint','1');}catch(er){}render();return;}
  if(b.dataset.filter){S.filter=b.dataset.filter;S.open={};render();return;}
  if(b.dataset.cat&&b.classList.contains('cat-h')){const c=b.dataset.cat;const el=$('#cat-'+c);S.open[c]=!el.classList.contains('open');render();return;}
  if(b.dataset.jump){const c=b.dataset.jump;S.open[c]=true;draw();const el=$('#cat-'+c);if(el)el.scrollIntoView({behavior:'smooth',block:'center'});return;}
  if(!S.edit)return;
  if(b.dataset.quick){quick();return;}
  if(b.dataset.qa){const k=b.dataset.qa;$('#sheet').innerHTML='';
    if(k==='km')kmSheet();
    else if(k==='part')sheet('Nouvelle pièce',PART_F,{cat:'autre',priceKind:'reel',status:'prevu'},o=>{if(!o.name)return toast('Donne un nom à la pièce');o.order=S.parts.length+1;o.zone='';o.url='';save('parts/'+newId('parts'),o);toast('🔧 Pièce ajoutée');},null,'name');
    else if(k==='log')sheet('Nouvelle entrée au carnet',LOG_F,{type:'etape',date:today(),km:S.set.kmNow},o=>{if(!o.title)return toast('Donne un titre à l\'entrée');save('log/'+newId('log'),o);toast('📖 Entrée ajoutée');},null,'title');
    else if(k==='task')sheet('Nouveau point d\'entretien',TASK_F,{emoji:'🛠️'},o=>{if(!o.name)return toast('Donne un nom');o.order=S.tasks.length;o.group='autre';save('tasks/'+newId('tasks'),o);toast('🛠️ Ajouté au plan');},null,'name');
    return;}
  if(b.dataset.cycle){const p=S.parts.find(x=>x.id===b.dataset.cycle);if(!p)return;const st=NEXT[p.status]||'prevu';const ch={status:st};if(st!=='prevu'&&!p.date)ch.date=today();if(st!=='prevu'&&p.km==null&&S.set.kmNow!=null)ch.km=S.set.kmNow;
    p.status=st;render();save('parts/'+p.id,ch,true);if(navigator.vibrate)try{navigator.vibrate(8);}catch(er){}toast(p.name.slice(0,30)+' → '+STAT[st]);return;}
  if(b.dataset.editpart){const p=S.parts.find(x=>x.id===b.dataset.editpart);if(!p)return;sheet('Modifier la pièce',PART_F,p,o=>{if(o.price!==p.price&&o.priceKind===p.priceKind&&p.priceKind==='estime')o.priceKind='reel';save('parts/'+p.id,o,true);toast('Pièce enregistrée');},()=>del('parts/'+p.id),b.dataset.focus);return;}
  if(b.dataset.add==='part'){sheet('Nouvelle pièce',PART_F,{cat:b.dataset.cat||'autre',priceKind:'reel',status:'prevu'},o=>{if(!o.name)return toast('Donne un nom à la pièce');o.order=S.parts.length+1;o.zone='';o.url='';save('parts/'+newId('parts'),o);toast('🔧 Pièce ajoutée');},null,'name');return;}
  if(b.dataset.edittask){const t=S.tasks.find(x=>x.id===b.dataset.edittask);if(!t)return;sheet('Modifier l\'entretien',TASK_F,t,o=>{save('tasks/'+t.id,o,true);toast('Entretien enregistré');},()=>del('tasks/'+t.id));return;}
  if(b.dataset.add==='task'){sheet('Nouveau point d\'entretien',TASK_F,{emoji:'🛠️'},o=>{if(!o.name)return toast('Donne un nom');o.order=S.tasks.length;o.group='autre';save('tasks/'+newId('tasks'),o);toast('🛠️ Ajouté au plan');},null,'name');return;}
  if(b.dataset.done){const t=S.tasks.find(x=>x.id===b.dataset.done);if(!t)return;const prev={lastKm:t.lastKm??null,lastDate:t.lastDate??null};const lid=newId('log');
    save('tasks/'+t.id,{lastKm:S.set.kmNow??t.lastKm??null,lastDate:today()},true);save('log/'+lid,{type:'entretien',title:t.name,date:today(),km:S.set.kmNow??null,cost:t.cost||0,note:''});
    toast('✔ '+t.name.slice(0,26)+' noté',()=>{save('tasks/'+t.id,prev,true);del('log/'+lid,true);});return;}
  if(b.dataset.add==='log'){sheet('Nouvelle entrée au carnet',LOG_F,{type:'etape',date:today(),km:S.set.kmNow},o=>{if(!o.title)return toast('Donne un titre à l\'entrée');save('log/'+newId('log'),o);toast('📖 Entrée ajoutée');},null,'title');return;}
  if(b.dataset.editlog){const l=S.log.find(x=>x.id===b.dataset.editlog);if(!l)return;sheet('Modifier l\'entrée',LOG_F,l,o=>{save('log/'+l.id,o,true);toast('Entrée enregistrée');},()=>del('log/'+l.id));return;}
});
let setT=null;
document.addEventListener('change',e=>{if(!S.edit)return;const el=e.target;
  if(el.dataset.set){const v=el.value===''?null:+String(el.value).replace(',','.');S.set[el.dataset.set]=v;clearTimeout(setT);setT=setTimeout(()=>save('settings/main',{[el.dataset.set]:v},!!S.ready.set),250);render();}
  if(el.dataset.fuel){S.set.fuel=el.value;save('settings/main',{fuel:el.value},!!S.ready.set);render();}
  if(el.dataset.tire){const tire=Object.assign({},S.set.tire||{});tire[el.dataset.tire]=el.dataset.tire==='model'?el.value:(el.value===''?null:+el.value);S.set.tire=tire;save('settings/main',{tire},!!S.ready.set);render();}
});

/* ---------- données ---------- */
draw();
(async()=>{try{const sel=encodeURIComponent('avg(sp98_prix) as sp98,avg(sp95_prix) as sp95,avg(e10_prix) as e10');
  const c=new AbortController();const tm=setTimeout(()=>c.abort(),7000);
  const r=await fetch('https://data.economie.gouv.fr/api/explore/v2.1/catalog/datasets/prix-des-carburants-en-france-flux-instantane-v2/records?select='+sel+'&limit=1',{signal:c.signal});clearTimeout(tm);
  if(!r.ok)return;const j=await r.json();const x=j&&j.results&&j.results[0];const ok=v=>typeof v==='number'&&v>0.8&&v<5;
  if(x&&ok(x.sp98)&&ok(x.e10)){S.fuelLive={sp98:x.sp98,sp95:ok(x.sp95)?x.sp95:null,e10:x.e10,date:today(),live:true};render();}}catch(e){}})();
(async()=>{
  const cl=window.claude;if(!cl||!cl.use){S.noDb=true;render();return;}
  let db=null,user=null;try{[db,user]=await Promise.all([cl.use('db'),cl.use('user')]);}catch(e){}
  if(!db){S.noDb=true;render();return;}
  S.db=db;try{S.canEdit=user?await user.canEdit():false;}catch(e){}S.edit=S.canEdit;
  const listen=(col,key)=>db.collection(col).onSnapshot(s=>{S[key]=s.docs.map(d=>Object.assign({id:d.id},d.data()));S.ready[key]=true;render();},()=>{});
  listen('parts','parts');listen('tasks','tasks');listen('log','log');
  db.doc('fuel/latest').onSnapshot(d=>{S.fuel=d.exists?d.data():null;render();},()=>{});
  db.collection('fuelHist').onSnapshot(s=>{S.fuelHist=s.docs.map(d=>Object.assign({id:d.id},d.data()));render();},()=>{});
  db.doc('settings/main').onSnapshot(d=>{S.set=d.exists?Object.assign({},d.data()):{};S.ready.set=d.exists;if(!S.set.tire)S.set.tire={model:'ps5'};render();},()=>{});
  render();
})();
})();
</script>
