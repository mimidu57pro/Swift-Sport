.ptl-in .ptl-bar>div{animation:ptBar .5s cubic-bezier(.4,0,.2,1) .3s forwards}
.ptl-out .ptl-bar>div{width:100%}

  simulate(t) {
    const p = (t % 9) / 9;
    let rpm, kmh, tps;
    if (p < 0.5) { const k = p / 0.5; rpm = 1500 + 5950 * k * k; kmh = 20 + 100 * k; tps = Math.min(100, 30 + 140 * k); }
    else if (p < 0.6) { const k = (p - 0.5) / 0.1; rpm = 7450 - 6450 * k; kmh = 120 - 10 * k; tps = 0; }
    else { rpm = 950 + 40 * Math.sin(t * 9); kmh = Math.max(0, 110 - (p - 0.6) / 0.4 * 110); tps = 0; }
    let gy;
    if (p < 0.5) gy = 0.38 - 0.25 * (p / 0.5);
    else if (p < 0.6) gy = -0.95 + 0.15 * Math.sin(t * 7);
    else gy = -0.08 + 0.05 * Math.sin(t * 3);
    const gx = 0.95 * Math.sin(t * 0.8) * Math.abs(Math.sin(t * 0.23)) + 0.03 * Math.sin(t * 11);
    return { rpm, kmh, tps, eau: 88 + 2 * Math.sin(t / 6), huile: 96 + 4 * Math.sin(t / 9) + Math.min(8, rpm / 900), iat: 31 + 3 * Math.sin(t / 7), batt: 14.1 + 0.08 * Math.sin(t * 1.3), gx, gy };
  }
